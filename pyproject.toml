[build-system]
# setuptools>=77 is the floor for the PEP 639 `license`/`license-files`
# fields used below, and setuptools_scm 9.x deprecated support for
# setuptools<80 and 10.0 removed it, so 80 is the real floor here.
requires = ["setuptools>=80", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figtreekit"
dynamic = ["version"]
description = "A Python library for programmatic styling of phylogenetic trees for FigTree visualization"
readme = "README_EN.md"
# Note: the distributed package additionally contains the patched FigTree
# JAR, which embeds iText (AGPL-3.0); see NOTICE and README for the
# combined-distribution licensing terms.
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    {name = "Zeng Zichao", email = "zengzichao@sjtu.edu.cn"},
]
keywords = ["phylogenetics", "tree", "newick", "nexus", "figtree", "visualization", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "biopython>=1.80,<2.0",
]

[project.urls]
Homepage = "https://github.com/ZengZichao/FigTreeKit"
Documentation = "https://github.com/ZengZichao/FigTreeKit#readme"
Repository = "https://github.com/ZengZichao/FigTreeKit"
"Bug Tracker" = "https://github.com/ZengZichao/FigTreeKit/issues"

[project.scripts]
figtreekit = "figtreekit._cli:main"

[project.optional-dependencies]
# Post-render appearance pass for raster output (--background-color /
# --foreground-color). The pass degrades with a CompatibilityWarning when
# Pillow is absent, so it stays optional rather than a hard requirement.
render = [
    "pillow>=10.0",
]
# Needed to re-run the measurement suite in benchmarks/. numpy is imported
# directly by full_benchmark.py; scipy replaces an asymptotic fallback for
# exact Student-t critical values and is optional.
benchmark = [
    "numpy>=1.24",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    # Bounded on purpose. black changes its stable style between majors, so
    # an unbounded floor makes `black --check` non-reproducible: the same
    # commit fails under one black release and passes under the next. Bump
    # this bound deliberately, in the same commit that reformats.
    "black>=26,<27",
    "flake8>=6.0",
    "mypy>=1.0",
]
# sphinx / sphinx-rtd-theme used to live here. There is no Sphinx source
# tree in this repository (docs/ holds plain Markdown, there is no conf.py
# and no .rst anywhere), nothing in CI built documentation, so the two
# dependencies were never exercised. Dropped rather than kept as dead
# weight; see docs/user_manual_EN.md for the manual.

[tool.setuptools.packages.find]
include = ["figtreekit*"]

[tool.setuptools.package-data]
figtreekit = ["figtree_patched.jar"]

[tool.setuptools_scm]
# Version claimed when there is no SCM to read (a wheel or an unpacked sdist
# with no .git). This is a manual step at release time: bump it to the tag
# being cut. Left at 1.1.4 it will silently mislabel any build made without
# git as 1.1.4, however far the code has moved on.
fallback_version = "1.1.4"
# `version_file`, not the deprecated `write_to`. They are not spellings of the
# same thing: write_to resolved its path against the SCM root and is
# documented upstream as broken for sdist builds (fixing it would be a
# breaking change), while version_file resolves against this file and works in
# every build context. Since MANIFEST.in ships figtreekit/*.py, the generated
# file lands in the sdist, which is what makes a downstream rebuild resolve
# the real version instead of falling back to fallback_version above.
#
# The three names below are the contract: figtreekit/__init__.py imports
# exactly these in a single statement, so a template that omits any one of
# them raises ImportError and the package silently falls back to a hardcoded
# version. That is why __version_date__ and __git_hash__ are emitted as ""
# rather than filled in here.
#
# They stay empty on purpose. The obvious improvement - writing them from the
# ScmVersion - cannot be done in this file: version_file_template is a plain
# str.format, so it has no way to express "use it if present, else empty", and
# the fields are exactly the optional ones. setuptools_scm sets node_date and
# node to None whenever it cannot read the SCM (a source tree without .git, a
# Docker build context, an sdist), so any format specifier on them raises
# `TypeError: unsupported format string passed to NoneType.__format__` and the
# build fails outright. The Dockerfile hit exactly that.
# Filling these in properly means deriving them in figtreekit/__init__.py,
# which is library code and out of scope here. figtreekit/_cli.py --version
# already falls back to `git rev-parse --short HEAD` for the hash, so nothing
# is lost for a source checkout.
# test/test_version_template.py renders this template against a ScmVersion
# whose node/node_date are None and fails if a format specifier ever returns.
version_file = "figtreekit/_version.py"
version_file_template = '''"""Version file generated by setuptools_scm. Do not edit manually."""
__version__ = "{version}"
__version_tuple__ = {version_tuple!r}
__version_date__ = ""
__git_hash__ = ""
'''

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=figtreekit --cov-report=html --cov-fail-under=60"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# figtreekit imports neither numpy nor scipy - only benchmarks/ does - but
# mypy scans typed packages in site-packages on its own, and numpy 2.x ships
# stubs written with PEP 695 `type` statements that a 3.11 target cannot
# parse. The result was not a list of errors but an abort:
#   "Type statement is only supported in Python 3.12 and greater"
#   "Found 1 error in 1 file (errors prevented further checking)"
# i.e. in any environment where `pip install -e ".[benchmark]"` had been run,
# mypy checked nothing at all. That is precisely the environment a maintainer
# re-measuring the published benchmarks is standing in.
# no_site_packages keeps mypy off third-party stubs entirely; untyped
# dependencies are already absorbed by --ignore-missing-imports.
no_site_packages = true
