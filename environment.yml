# Deployment environment (supported interpreter: Python 3.11 on macOS/Ubuntu).
# The published benchmark and coverage figures were produced in a different,
# frozen environment - see environment-benchmark.yml.
name: figtreekit
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11,<3.12
  - biopython>=1.80,<2.0
  - openjdk>=8
  - ant
  - pip
  - pip:
    - -e .
