# Environment used to PRODUCE the published benchmark and coverage figures.
# This is deliberately separate from environment.yml, which pins the supported
# deployment interpreter (Python 3.11). The scaling ladder (50-10,000 taxa) and
# the GTDB reference trees were measured in the frozen environment recorded in
# benchmarks/benchmark_meta.json; reproducing the manuscript numbers requires
# this environment, not the deployment one.
name: figtreekit-benchmark
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.14.6
  - biopython=1.87
  - openjdk=8
  - ant
  - numpy
  - scipy
  - matplotlib
  - pip
  - pip:
      - pytest
      - pytest-cov
      - coverage
      - hypothesis>=6.0
      - figtreekit==1.1.1
