name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # v* tags trigger the publish job (Trusted Publishing to PyPI)
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for setuptools_scm version discovery

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 figtreekit/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 figtreekit/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Type check with mypy
      # Non-blocking: 118 pre-existing untyped-def errors exist. Report them
      # in the log without failing the build; re-enable strict gating once the
      # codebase is incrementally typed.
      continue-on-error: true
      run: |
        mypy figtreekit/ --ignore-missing-imports

    - name: Test with pytest (60% coverage threshold)
      run: |
        pytest -v --cov=figtreekit --cov-report=xml --cov-fail-under=60

    - name: Self-test
      run: |
        python -m figtreekit --self-test

    - name: Upload coverage to Codecov
      if: matrix.os == 'macos-latest' && matrix.python-version == '3.11'
      # Non-blocking: tokenless uploads can fail on pushes; coverage report
      # is still produced locally by the pytest step above.
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t figtreekit-ci .

    - name: Test Docker image (self-test)
      # The image sets ENTRYPOINT ["figtreekit"], so just pass CLI args here.
      run: docker run --rm figtreekit-ci --self-test

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "."

    - name: Run benchmarks
      run: |
        python benchmarks/performance.py --sizes 10 50 100 500 --repeats 10

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmarks/results.csv

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi  # must match the Environment name configured on PyPI's Trusted Publisher
    permissions:
      # Required for Trusted Publishing (OIDC) to PyPI
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for setuptools_scm version discovery

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
