[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figtreekit"
dynamic = ["version"]
description = "A Python library for programmatic styling of phylogenetic trees for FigTree visualization"
readme = "README_EN.md"
# Note: the distributed package additionally contains the patched FigTree
# JAR, which embeds iText (AGPL-3.0); see NOTICE and README for the
# combined-distribution licensing terms.
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    {name = "Zeng Zichao", email = "zengzichao@sjtu.edu.cn"},
]
keywords = ["phylogenetics", "tree", "newick", "nexus", "figtree", "visualization", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "biopython>=1.80,<2.0",
]

[project.urls]
Homepage = "https://github.com/ZengZichao/FigTreeKit"
Documentation = "https://github.com/ZengZichao/FigTreeKit#readme"
Repository = "https://github.com/ZengZichao/FigTreeKit"
"Bug Tracker" = "https://github.com/ZengZichao/FigTreeKit/issues"

[project.scripts]
figtreekit = "figtreekit._cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.setuptools.packages.find]
include = ["figtreekit*"]

[tool.setuptools.package-data]
figtreekit = ["figtree_patched.jar"]

[tool.setuptools_scm]
# Fallback version for builds without git (e.g. PyPI wheels)
fallback_version = "1.0.2"
# Write version to _version.py during build using a custom template
# that also captures the git commit hash and commit date.
write_to = "figtreekit/_version.py"
write_to_template = '''"""Version file generated by setuptools_scm. Do not edit manually."""
__version__ = "{version}"
__version_date__ = ""
__git_hash__ = ""
'''

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=figtreekit --cov-report=html --cov-fail-under=60"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
